  .sub{margin:0 0 .8vh;flex:none;font-size:clamp(13px,min(2vw,3.4vh),24px);text-align:center;opacity:.85}
  .bar{display:flex;gap:10px;align-items:center;margin-bottom:.8vh;flex:none;flex-wrap:wrap;justify-content:center}
  .score{background:var(--paper);border:2px solid var(--gold);border-radius:999px;padding:4px 18px;font-weight:700;font-size:clamp(13px,min(1.8vw,3vh),22px)}
  button.ctl{
    font:inherit;font-weight:700;color:var(--ink);cursor:pointer;
    background:var(--gold);border:0;border-radius:999px;padding:4px 16px;font-size:clamp(13px,min(1.8vw,3vh),22px);
    box-shadow:0 2px 0 #b97f1c;
  }
  button.ctl:active{transform:translateY(1px);box-shadow:none}

  .board{
    position:relative;width:min(1500px,100%);flex:1 1 0;min-height:0;
    display:grid;grid-template-columns:1fr minmax(90px,16%) 1fr;
    background:rgba(255,248,230,.55);
    border:2px dashed #cfa04e;border-radius:22px;padding:1.4vh 18px;
    backdrop-filter:blur(2px);
  }
  .col{display:grid;grid-template-rows:repeat(8,minmax(0,1fr));gap:1.2vh;min-height:0}
  .mid{pointer-events:none}
  svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}

  .item{
    display:flex;align-items:center;gap:6px;
    min-height:0;height:100%;overflow:hidden;
    background:var(--paper);
    border:2px solid #d9b266;border-radius:18px;
    padding:2px 14px;
    font:inherit;font-size:clamp(13px,min(2.5vw,4.4vh),36px);line-height:1.1;font-weight:700;color:var(--ink);
    cursor:pointer;text-align:left;
    transition:transform .12s, box-shadow .12s, background .2s, border-color .2s;
    box-shadow:0 2px 0 #d9b266;
  }
  .item:hover:not(:disabled){transform:scale(1.025)}
  .item.right{flex-direction:row-reverse;text-align:right}
  .item .txt{flex:1}
  .item .ear{height:88%;width:auto;aspect-ratio:150/70;max-width:34%;flex:none}
  .item.right .ear{transform:scaleX(-1)}
  .item.sel{background:#ffe9a6;border-color:#e08a00;box-shadow:0 0 0 3px rgba(224,138,0,.35)}
  .item.done{background:#e6f3d4;border-color:var(--ok);box-shadow:0 2px 0 var(--ok);cursor:default}
  .item.wrong{animation:shake .45s;border-color:var(--bad);background:#fde0d8}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    40%{transform:translateX(6px)}
    60%{transform:translateX(-4px)}
    80%{transform:translateX(4px)}
  }
  .hint{font-size:13px;margin-top:8px;opacity:.8;text-align:center}

  .win{
    position:fixed;inset:0;background:rgba(90,58,26,.55);
    display:none;align-items:center;justify-content:center;z-index:10;
  }
  .win.show{display:flex}
  .win .box{
    background:var(--paper);border:3px solid var(--gold);border-radius:22px;
    padding:26px 34px;text-align:center;max-width:90%;
    animation:pop .4s ease-out;
  }
  .win h2{margin:0 0 6px;font-size:30px}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>
  <div class="sub">Match the affirmative sentences with the negative sentences.</div>
  <div class="bar">
    <div class="score">Correct: <span id="ok">0</span> / 8 &nbsp;·&nbsp; Mistakes: <span id="err">0</span></div>
    <button class="ctl" id="restart">Restart</button>
  </div>

  <div class="board" id="board">
    <div class="col" id="left"></div>
    <div class="mid"></div>
    <div class="col" id="right"></div>
    <svg class="lines" id="lines"></svg>
  </div>

  <div class="win" id="win">
    <div class="box">
      <h2>🎉 Great job!</h2>
      <div id="winText"></div><br>
      <button class="ctl" id="again">Play again</button>
    </div>
  </div>

<!-- Колосок (акварельный стиль) -->
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="grain" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7c95a"/>
      <stop offset="1" stop-color="#e98f2c"/>
    </linearGradient>
    <symbol id="wheat" viewBox="0 0 150 70">
      <!-- стебель -->
      <path d="M3 62 Q22 40 40 36" stroke="#a9641e" stroke-width="4" fill="none" stroke-linecap="round"/>
      <!-- усики -->
      <g stroke="#b9772a" stroke-width="1.4" fill="none" stroke-linecap="round">
        <path d="M52 30 Q58 14 70 6"/><path d="M68 28 Q76 12 90 4"/>
        <path d="M84 28 Q92 12 108 6"/><path d="M100 30 Q110 16 126 12"/>
        <path d="M114 34 Q128 26 146 28"/>
        <path d="M52 46 Q60 60 72 66"/><path d="M68 48 Q78 62 92 67"/>
        <path d="M84 48 Q96 62 112 66"/><path d="M100 46 Q114 58 130 58"/>
      </g>
      <!-- зёрна -->
      <g fill="url(#grain)" stroke="#a9641e" stroke-width="1.6">
        <ellipse cx="46" cy="33" rx="9" ry="5.5" transform="rotate(-25 46 33)"/>
        <ellipse cx="62" cy="31" rx="10" ry="6" transform="rotate(-20 62 31)"/>
        <ellipse cx="79" cy="31" rx="10" ry="6" transform="rotate(-15 79 31)"/>
        <ellipse cx="96" cy="33" rx="10" ry="6" transform="rotate(-10 96 33)"/>
        <ellipse cx="112" cy="36" rx="9" ry="5.5" transform="rotate(-5 112 36)"/>
        <ellipse cx="46" cy="42" rx="9" ry="5.5" transform="rotate(25 46 42)"/>
        <ellipse cx="62" cy="43" rx="10" ry="6" transform="rotate(20 62 43)"/>
        <ellipse cx="79" cy="43" rx="10" ry="6" transform="rotate(15 79 43)"/>
        <ellipse cx="96" cy="42" rx="10" ry="6" transform="rotate(10 96 42)"/>
        <ellipse cx="112" cy="40" rx="9" ry="5.5" transform="rotate(5 112 40)"/>
      </g>
      <!-- блики -->
      <g fill="#fff6c9" opacity=".75">
        <ellipse cx="60" cy="29" rx="4" ry="1.8"/><ellipse cx="77" cy="29" rx="4" ry="1.8"/>
        <ellipse cx="94" cy="31" rx="4" ry="1.8"/><ellipse cx="62" cy="41" rx="4" ry="1.8"/>
        <ellipse cx="79" cy="41" rx="4" ry="1.8"/><ellipse cx="96" cy="40" rx="4" ry="1.8"/>
      </g>
    </symbol>
  </defs>
</svg>

<script>
  // 8 пар: утверждение -> отрицание
  const PAIRS = [
    { a: "I'm a student.",        n: "I'm not a student." },
    { a: "You're my friend.",     n: "You aren't my friend." },
    { a: "He's a doctor.",        n: "He isn't a doctor." },
    { a: "She's happy.",          n: "She isn't happy." },
    { a: "It's a big cat.",       n: "It isn't a big cat." },
    { a: "We're at school.",      n: "We aren't at school." },
    { a: "They're tall.",         n: "They aren't tall." },
    { a: "The sun's hot.",        n: "The sun isn't hot." }
  ];

  const leftEl = document.getElementById("left");
  const rightEl = document.getElementById("right");
  const board = document.getElementById("board");
  const svg = document.getElementById("lines");
  const okEl = document.getElementById("ok");
  const errEl = document.getElementById("err");
  const winEl = document.getElementById("win");

  let selected = null, ok = 0, err = 0, links = [];

  const shuffle = arr => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  };

  const ear = () => `<svg class="ear" viewBox="0 0 150 70"><use href="#wheat"/></svg>`;

  function makeItem(id, text, side) {
    const b = document.createElement("button");
    b.className = "item " + side;
    b.dataset.id = id;
    b.dataset.side = side;
    b.innerHTML = `<span class="txt">${text}</span>${ear()}`;
    b.addEventListener("click", () => onPick(b));
    return b;
  }

  function build() {
    leftEl.innerHTML = rightEl.innerHTML = svg.innerHTML = "";
    selected = null; ok = 0; err = 0; links = [];
    okEl.textContent = 0; errEl.textContent = 0;
    winEl.classList.remove("show");
    const idx = PAIRS.map((_, i) => i);
    shuffle(idx).forEach(i => leftEl.appendChild(makeItem(i, PAIRS[i].a, "left")));
    shuffle(idx).forEach(i => rightEl.appendChild(makeItem(i, PAIRS[i].n, "right")));
  }

  function anchor(el) {
    const r = el.querySelector(".ear").getBoundingClientRect();
    const b = board.getBoundingClientRect();
    return { x: r.left + r.width / 2 - b.left, y: r.top + r.height / 2 - b.top };
  }

  function drawLine(l, r, color) {
    const p1 = anchor(l), p2 = anchor(r);
    const mx = (p1.x + p2.x) / 2;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d", `M${p1.x} ${p1.y} C ${mx} ${p1.y}, ${mx} ${p2.y}, ${p2.x} ${p2.y}`);
    path.setAttribute("stroke", color);
    path.setAttribute("stroke-width", "4");
    path.setAttribute("stroke-linecap", "round");
    path.setAttribute("fill", "none");
    svg.appendChild(path);
    return path;
  }

  function redraw() {
    svg.innerHTML = "";
    links.forEach(([l, r]) => drawLine(l, r, "#5f9b3c"));
  }

  function onPick(el) {
    if (el.classList.contains("done")) return;

    if (el.dataset.side === "left") {
      if (selected) selected.classList.remove("sel");
      selected = el;
      el.classList.add("sel");
      return;
    }
    // правая сторона
    if (!selected) {
      el.classList.add("wrong");
      setTimeout(() => el.classList.remove("wrong"), 450);
      return;
    }
    const left = selected;
    if (left.dataset.id === el.dataset.id) {
      left.classList.remove("sel");
      left.classList.add("done");
      el.classList.add("done");
      links.push([left, el]);
      redraw();
      selected = null;
      okEl.textContent = ++ok;
      if (ok === PAIRS.length) finish();
    } else {
      errEl.textContent = ++err;
      const line = drawLine(left, el, "#d2573a");
      left.classList.add("wrong"); el.classList.add("wrong");
      setTimeout(() => {
        line.remove();
        left.classList.remove("wrong"); el.classList.remove("wrong");
      }, 600);
    }
  }

  function finish() {
    document.getElementById("winText").textContent =
      err === 0 ? "No mistakes! 🌟" : `Mistakes: ${err}. Try again to do better!`;
    setTimeout(() => winEl.classList.add("show"), 500);
  }

  document.getElementById("restart").onclick = build;
  document.getElementById("again").onclick = build;
  window.addEventListener("resize", redraw);
  build();
</script>
</body>
</html>
